name: Deploy Aneta Reports to LXC g4-apps

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Go Binary & Run Static Site Generator
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o aneta-api main.go
          chmod +x aneta-api
          go run main.go build

      - name: Install Cloudflared on Runner
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Deploy to LXC g4-apps via SSH (Cloudflare Tunnel)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Configure SSH to proxy through cloudflared
          cat << EOF >> ~/.ssh/config
          Host $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

          # Ensure destination directory exists on LXC
          ssh $DEPLOY_HOST "
            sudo mkdir -p /var/www/report
            sudo chown -R $DEPLOY_USER:$DEPLOY_USER /var/www/report
          "

          # Sync generated static files to /var/www/report
          rsync -avz -e "ssh" --delete \
            --exclude '.git' \
            --exclude '.github' \
            ./ $DEPLOY_HOST:/var/www/report/

          # Ensure routes, permissions, and reload Nginx
          ssh $DEPLOY_HOST "
            set -e
            echo '==> Verifying web routes in /var/www/report...'
            cd /var/www/report
            
            # Ensure route for /octa-telkomsel-model-comparison
            if [ -f octa-telkomsel-model-comparison.html ] && [ ! -d octa-telkomsel-model-comparison ]; then
              mkdir -p octa-telkomsel-model-comparison
              cp octa-telkomsel-model-comparison.html octa-telkomsel-model-comparison/index.html
            fi

            # Set web server ownership & permissions
            sudo chown -R www-data:www-data /var/www/report || true
            sudo chmod -R 755 /var/www/report

            # Install systemd service for Go API backend if not running
            if [ -f aneta-research.service ]; then
              sudo cp aneta-research.service /etc/systemd/system/
              sudo chmod 644 /etc/systemd/system/aneta-research.service
              sudo chmod +x /var/www/report/aneta-api
              sudo systemctl daemon-reload
              sudo systemctl enable aneta-research.service
              sudo systemctl restart aneta-research.service
              sleep 2
              sudo systemctl status aneta-research.service --no-pager || true
            fi

            # Ensure Nginx sites-available/default proxies /api/
            sudo sed -i '/location \/api\//d' /etc/nginx/sites-available/default 2>/dev/null || true
            sudo sed -i '/proxy_pass http:\/\/127.0.0.1:8088/d' /etc/nginx/sites-available/default 2>/dev/null || true
            sudo sed -i '/server_name/a \    location /api/ { proxy_pass http://127.0.0.1:8088; proxy_set_header Host $host; proxy_read_timeout 300s; }' /etc/nginx/sites-available/default || true

            # Configure Nginx reverse proxy for /api/
            if [ -f configure_nginx.py ]; then
              sudo python3 configure_nginx.py
            fi
            sudo nginx -t && (sudo systemctl reload nginx || sudo service nginx reload)
            echo '==> Deployment to report.aneta.my.id successfully completed!'
          "

      - name: Send Telegram Notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEVINA_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEVINA_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MESSAGE="📊 <b>Aneta Reports Deployed Successfully!</b>%0A%0A<b>Site:</b> https://report.aneta.my.id%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Commit:</b> ${{ github.sha }}%0A<b>Target:</b> LXC g4-apps (/var/www/report)"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=${MESSAGE}"
          fi
